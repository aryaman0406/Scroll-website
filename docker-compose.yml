services:
  scroll-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: scroll-website:latest
    container_name: scroll_website_app
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
